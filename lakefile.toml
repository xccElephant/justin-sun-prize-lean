name = "JspBounties"
defaultTargets = ["JspBounties"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "JspBounties"
# Build the standalone problem modules; there is no JspBounties.lean root module.
globs = ["JspBounties.+"]
